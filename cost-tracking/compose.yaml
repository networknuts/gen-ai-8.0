services:
  prometheus:
    image: docker.io/prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - '9090:9090'
    networks:
      - monitoring_network

  grafana:
    image: docker.io/grafana/grafana:latest
    container_name: grafana
    ports:
      - '3000:3000'
    networks:
      - monitoring_network

networks:
  monitoring_network: {}

# PROMETHEUS - NO AUTH
# GRAFANA - AUTH - admin/admin